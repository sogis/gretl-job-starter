name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-native:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env: &native-env
      DOCKER_ACCOUNT: sogis
      DOCKER_REPO: gretl-job-starter
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION: 0.0.${{ github.run_number }}

    runs-on: &native-runner ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps: &native-steps
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        env:
          LOG_LEVEL_APP: INFO
        run: |
          ./gradlew clean test
          ./gradlew nativeBuild

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: reports
          path: build/reports/tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64 container for smoke test
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: .
          file: Dockerfile.native
          pull: true
          load: true
          tags: gretl-job-starter:ci

      - name: Install x86-64 user-mode emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Smoke-test native container on x86-64-v2
        shell: bash
        run: |
          readelf -n build/native/nativeCompile/jobstarter
          id=$(docker run -d --user 1000830000:0 --read-only --tmpfs /tmp:rw,exec \
            -p 127.0.0.1::8080 \
            -v /usr/bin/qemu-x86_64-static:/qemu-x86_64-static:ro --entrypoint /qemu-x86_64-static \
            gretl-job-starter:ci -cpu Nehalem ./application)
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          url="http://$(docker port "$id" 8080/tcp)"
          curl -fsS --max-time 3 --retry 20 --retry-all-errors --retry-max-time 45 \
            "$url/actuator/health/readiness" | jq -e '.status == "UP"'
          test "$(curl -fsS --max-time 3 "$url/ping")" = gretl-job-starter
          curl -fsS --max-time 3 "$url/actuator/health/liveness" | jq -e '.status == "UP"'

      - name: Login to Docker Container Registry
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated AMD64 build
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: .
          file: Dockerfile.native
          push: true
          tags: |
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0.0
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:latest
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0.0
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0

  verify-native:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    env: *native-env
    runs-on: *native-runner
    permissions:
      contents: read
    steps: *native-steps
