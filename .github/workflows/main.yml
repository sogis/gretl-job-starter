name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-native:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env: &native-env
      DOCKER_ACCOUNT: sogis
      DOCKER_REPO: gretl-job-starter
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION: 0.0.${{ github.run_number }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps: &native-steps
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        env:
          LOG_LEVEL_APP: INFO
        run: |
          ./gradlew clean test
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            ln -s gcc .github/diagnostics/cc
            export PATH="$GITHUB_WORKSPACE/.github/diagnostics:$PATH"
          fi
          status=0
          ./gradlew nativeBuild || status=$?
          if [[ -f "$RUNNER_TEMP/native-link.log" ]]; then cat "$RUNNER_TEMP/native-link.log"; fi
          if [[ -f build/native/nativeCompile/jobstarter ]]; then readelf -n build/native/nativeCompile/jobstarter; fi
          exit "$status"

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: reports
          path: build/reports/tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Container Registry
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AMD64 container and publish on main
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: .
          file: Dockerfile.native
          pull: true
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
          tags: |
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0.0
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:latest
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0.0
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0

      - name: Smoke-test native container
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          id=$(docker run -d --user 1000830000:0 --read-only --tmpfs /tmp:rw,exec \
            -p 127.0.0.1::8080 "$DOCKER_ACCOUNT/$DOCKER_REPO:latest")
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          url="http://$(docker port "$id" 8080/tcp)"
          curl -fsS --max-time 3 --retry 20 --retry-all-errors --retry-max-time 45 \
            "$url/actuator/health/readiness" | jq -e '.status == "UP"'
          test "$(curl -fsS --max-time 3 "$url/ping")" = gretl-job-starter
          curl -fsS --max-time 3 "$url/actuator/health/liveness" | jq -e '.status == "UP"'

  verify-native:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    env: *native-env
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps: *native-steps
